[project]
name = "hackproof"
version = "0.0.1"
description = "Quality audits for RL environments and benchmark graders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
hackproof = "hackproof.cli:app"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
